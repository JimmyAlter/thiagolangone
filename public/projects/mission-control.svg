  <g>
    <rect x="388" y="478" width="20" height="26" rx="5" fill="#f97362" />
    <circle cx="398" cy="472" r="7" fill="#ff9d90" />
    <text x="398" y="558" fill="#f97362" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">tickets</text>
  </g>

  <!-- side panel -->
  <rect x="754" y="240" width="356" height="400" rx="14" fill="#12121b" stroke="#1e2a40" />
  <text x="776" y="268" fill="#61708a" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2">ACTIVITY</text>

  <rect x="776" y="286" width="312" height="46" rx="9" fill="#151522" />
  <circle cx="796" cy="309" r="5" fill="#22c55e" />
  <text x="812" y="305" fill="#c9d6ea" font-family="JetBrains Mono, monospace" font-size="11">agent sync complete</text>
  <text x="812" y="322" fill="#46516b" font-family="JetBrains Mono, monospace" font-size="10">synced: 5 · created: 0</text>

  <rect x="776" y="342" width="312" height="46" rx="9" fill="#151522" />
  <circle cx="796" cy="365" r="5" fill="#60daff" />
  <text x="812" y="361" fill="#c9d6ea" font-family="JetBrains Mono, monospace" font-size="11">heartbeat</text>
  <text x="812" y="378" fill="#46516b" font-family="JetBrains Mono, monospace" font-size="10">every 5 min</text>

  <rect x="776" y="398" width="312" height="46" rx="9" fill="#151522" />
  <circle cx="796" cy="421" r="5" fill="#a78bfa" />
  <text x="812" y="417" fill="#c9d6ea" font-family="JetBrains Mono, monospace" font-size="11">migrations applied</text>
  <text x="812" y="434" fill="#46516b" font-family="JetBrains Mono, monospace" font-size="10">SQLite · WAL</text>

  <rect x="776" y="454" width="312" height="46" rx="9" fill="#151522" />
  <circle cx="796" cy="477" r="5" fill="#eab308" />
  <text x="812" y="473" fill="#c9d6ea" font-family="JetBrains Mono, monospace" font-size="11">nightly backup</text>
  <text x="812" y="490" fill="#46516b" font-family="JetBrains Mono, monospace" font-size="10">03:00 · cleanup 04:00</text>

  <text x="776" y="560" fill="#46516b" font-family="JetBrains Mono, monospace" font-size="10.5">integer-only zoom</text>
  <text x="776" y="582" fill="#46516b" font-family="JetBrains Mono, monospace" font-size="10.5">fixed 24 × 16 tilemap</text>
  <text x="776" y="604" fill="#46516b" font-family="JetBrains Mono, monospace" font-size="10.5">standalone production build</text>

  <text x="90" y="672" fill="#46516b" font-family="JetBrains Mono, monospace" font-size="12">Next.js 16 · React · TailwindCSS · SQLite (better-sqlite3)</text>
