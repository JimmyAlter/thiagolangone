  <g>
    <rect x="196" y="478" width="20" height="26" rx="5" fill="#a78bfa" />
    <circle cx="206" cy="472" r="7" fill="#c4b1ff" />
    <text x="206" y="558" fill="#a78bfa" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">users</text>
