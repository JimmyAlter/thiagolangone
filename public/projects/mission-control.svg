<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="Mission Control dashboard preview">
  <defs>
    <linearGradient id="bgM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0f" />
      <stop offset="1" stop-color="#141024" />
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bgM)" />
  <rect x="50" y="50" width="1100" height="650" rx="22" fill="#11111b" stroke="#1e2a40" />

  <rect x="50" y="50" width="1100" height="52" rx="22" fill="#161626" />
  <circle cx="84" cy="76" r="6" fill="#ff5f57" />
  <circle cx="104" cy="76" r="6" fill="#febc2e" />
  <circle cx="124" cy="76" r="6" fill="#28c840" />
  <text x="160" y="82" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="14">mission-control · agent fleet</text>

  <!-- status row -->
  <rect x="90" y="132" width="238" height="76" rx="12" fill="#151522" stroke="#1e2a40" />
  <text x="112" y="160" fill="#61708a" font-family="JetBrains Mono, monospace" font-size="10.5" letter-spacing="2">AGENTS ONLINE</text>
  <text x="112" y="192" fill="#22c55e" font-family="JetBrains Mono, monospace" font-size="26" font-weight="700">5 / 5</text>

  <rect x="344" y="132" width="238" height="76" rx="12" fill="#151522" stroke="#1e2a40" />
  <text x="366" y="160" fill="#61708a" font-family="JetBrains Mono, monospace" font-size="10.5" letter-spacing="2">SYNC INTERVAL</text>
  <text x="366" y="192" fill="#60daff" font-family="JetBrains Mono, monospace" font-size="26" font-weight="700">60 s</text>

  <rect x="598" y="132" width="238" height="76" rx="12" fill="#151522" stroke="#1e2a40" />
  <text x="620" y="160" fill="#61708a" font-family="JetBrains Mono, monospace" font-size="10.5" letter-spacing="2">GRID</text>
  <text x="620" y="192" fill="#a78bfa" font-family="JetBrains Mono, monospace" font-size="26" font-weight="700">32 px</text>

  <rect x="852" y="132" width="258" height="76" rx="12" fill="#151522" stroke="#1e2a40" />
  <text x="874" y="160" fill="#61708a" font-family="JetBrains Mono, monospace" font-size="10.5" letter-spacing="2">TESTS</text>
