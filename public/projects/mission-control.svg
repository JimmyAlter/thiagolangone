    <line x1="110" y1="604" x2="710" y2="604" />
    <line x1="110" y1="284" x2="110" y2="604" /><line x1="142" y1="284" x2="142" y2="604" />
    <line x1="174" y1="284" x2="174" y2="604" /><line x1="206" y1="284" x2="206" y2="604" />
    <line x1="238" y1="284" x2="238" y2="604" /><line x1="270" y1="284" x2="270" y2="604" />
    <line x1="302" y1="284" x2="302" y2="604" /><line x1="334" y1="284" x2="334" y2="604" />
    <line x1="366" y1="284" x2="366" y2="604" /><line x1="398" y1="284" x2="398" y2="604" />
    <line x1="430" y1="284" x2="430" y2="604" /><line x1="462" y1="284" x2="462" y2="604" />
    <line x1="494" y1="284" x2="494" y2="604" /><line x1="526" y1="284" x2="526" y2="604" />
    <line x1="558" y1="284" x2="558" y2="604" /><line x1="590" y1="284" x2="590" y2="604" />
    <line x1="622" y1="284" x2="622" y2="604" /><line x1="654" y1="284" x2="654" y2="604" />
    <line x1="686" y1="284" x2="686" y2="604" />
  </g>

  <!-- desks -->
  <rect x="176" y="350" width="60" height="28" rx="4" fill="#26304a" />
  <rect x="368" y="350" width="60" height="28" rx="4" fill="#26304a" />
  <rect x="560" y="350" width="60" height="28" rx="4" fill="#26304a" />
  <rect x="176" y="510" width="60" height="28" rx="4" fill="#26304a" />
  <rect x="368" y="510" width="60" height="28" rx="4" fill="#26304a" />

