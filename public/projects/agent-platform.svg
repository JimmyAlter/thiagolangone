<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="Agent platform architecture: deterministic interception, orchestrator, specialist agents and MCP servers">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0f" />
      <stop offset="1" stop-color="#101a24" />
    </linearGradient>
    <linearGradient id="fastPath" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e" />
      <stop offset="1" stop-color="#60daff" />
    </linearGradient>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 1 L7 4.5 L0 8 Z" fill="#46516b" />
    </marker>
    <marker id="arwFast" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 1 L7 4.5 L0 8 Z" fill="#22c55e" />
    </marker>
  </defs>

  <rect width="1200" height="750" fill="url(#bgA)" />
  <rect x="50" y="50" width="1100" height="650" rx="22" fill="#11111b" stroke="#1e2a40" />

  <!-- title bar -->
  <rect x="50" y="50" width="1100" height="52" rx="22" fill="#161626" />
  <circle cx="84" cy="76" r="6" fill="#ff5f57" />
  <circle cx="104" cy="76" r="6" fill="#febc2e" />
  <circle cx="124" cy="76" r="6" fill="#28c840" />
  <text x="160" y="82" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="14">agent-gateway · production</text>
  <text x="1120" y="82" fill="#61708a" font-family="JetBrains Mono, monospace" font-size="12" text-anchor="end">local inference</text>

  <!-- inbound -->
  <rect x="90" y="140" width="200" height="58" rx="12" fill="#151522" stroke="#1e2a40" />
  <text x="190" y="166" fill="#ebf2ff" font-family="JetBrains Mono, monospace" font-size="13" text-anchor="middle">Inbound message</text>
  <text x="190" y="185" fill="#61708a" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">Telegram</text>

  <!-- interceptor -->
  <rect x="350" y="132" width="250" height="74" rx="12" fill="#0d1f18" stroke="#22c55e" stroke-opacity="0.55" />
  <text x="475" y="158" fill="#22c55e" font-family="JetBrains Mono, monospace" font-size="13" text-anchor="middle" font-weight="600">Intent interception</text>
  <text x="475" y="178" fill="#7fd8a4" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">deterministic code · pre-inference</text>
  <text x="475" y="196" fill="#61708a" font-family="JetBrains Mono, monospace" font-size="10.5" text-anchor="middle">regex match → model never sees it</text>

  <line x1="292" y1="169" x2="344" y2="169" stroke="#46516b" stroke-width="1.6" marker-end="url(#arw)" />

  <!-- fast path -->
  <path d="M602 155 L760 155" stroke="url(#fastPath)" stroke-width="2.4" marker-end="url(#arwFast)" />
  <rect x="772" y="128" width="290" height="60" rx="12" fill="#101d1a" stroke="#22c55e" stroke-opacity="0.4" />
  <text x="917" y="152" fill="#22c55e" font-family="JetBrains Mono, monospace" font-size="13" text-anchor="middle" font-weight="600">&lt; 2 s response</text>
  <text x="917" y="172" fill="#61708a" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">was 60–150 s of model inference</text>

  <!-- fallback down to orchestrator -->
  <path d="M475 212 L475 258" stroke="#46516b" stroke-width="1.6" marker-end="url(#arw)" />
  <text x="492" y="240" fill="#61708a" font-family="JetBrains Mono, monospace" font-size="10.5">no match → reasoning</text>

  <!-- orchestrator -->
  <rect x="350" y="262" width="250" height="62" rx="12" fill="#151522" stroke="#60daff" stroke-opacity="0.5" />
  <text x="475" y="288" fill="#60daff" font-family="JetBrains Mono, monospace" font-size="13" text-anchor="middle" font-weight="600">Orchestrator</text>
  <text x="475" y="308" fill="#61708a" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">local model · Ollama</text>

  <!-- specialists -->
  <text x="120" y="382" fill="#61708a" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2">SPECIALIST AGENTS — isolated workspace + tool deny-list</text>

  <rect x="110" y="398" width="230" height="82" rx="12" fill="#151522" stroke="#1e2a40" />
  <text x="130" y="424" fill="#ebf2ff" font-family="JetBrains Mono, monospace" font-size="13">inventory</text>
  <text x="130" y="446" fill="#61708a" font-family="JetBrains Mono, monospace" font-size="10.5">500+ endpoints · 6 companies</text>
  <rect x="130" y="456" width="80" height="16" rx="8" fill="#0d1f18" />
  <text x="170" y="468" fill="#22c55e" font-family="JetBrains Mono, monospace" font-size="9.5" text-anchor="middle">read-only</text>

  <rect x="358" y="398" width="230" height="82" rx="12" fill="#151522" stroke="#1e2a40" />
  <text x="378" y="424" fill="#ebf2ff" font-family="JetBrains Mono, monospace" font-size="13">reporting</text>
  <text x="378" y="446" fill="#61708a" font-family="JetBrains Mono, monospace" font-size="10.5">PDF pipeline · SMTP delivery</text>
  <rect x="378" y="456" width="102" height="16" rx="8" fill="#1e1a0d" />
  <text x="429" y="468" fill="#eab308" font-family="JetBrains Mono, monospace" font-size="9.5" text-anchor="middle">confirm first</text>

  <rect x="606" y="398" width="230" height="82" rx="12" fill="#151522" stroke="#1e2a40" />
  <text x="626" y="424" fill="#ebf2ff" font-family="JetBrains Mono, monospace" font-size="13">user accounts</text>
  <text x="626" y="446" fill="#61708a" font-family="JetBrains Mono, monospace" font-size="10.5">AD unlock / disable · 4-step flow</text>
  <rect x="626" y="456" width="128" height="16" rx="8" fill="#1e1a0d" />
  <text x="690" y="468" fill="#eab308" font-family="JetBrains Mono, monospace" font-size="9.5" text-anchor="middle">write · gated in code</text>

  <rect x="854" y="398" width="230" height="82" rx="12" fill="#151522" stroke="#1e2a40" />
  <text x="874" y="424" fill="#ebf2ff" font-family="JetBrains Mono, monospace" font-size="13">help desk</text>
  <text x="874" y="446" fill="#61708a" font-family="JetBrains Mono, monospace" font-size="10.5">Zammad tickets</text>
  <rect x="874" y="456" width="80" height="16" rx="8" fill="#0d1f18" />
  <text x="914" y="468" fill="#22c55e" font-family="JetBrains Mono, monospace" font-size="9.5" text-anchor="middle">read-only</text>

  <path d="M430 330 L225 392" stroke="#46516b" stroke-width="1.4" marker-end="url(#arw)" />
  <path d="M468 330 L470 392" stroke="#46516b" stroke-width="1.4" marker-end="url(#arw)" />
  <path d="M520 330 L714 392" stroke="#46516b" stroke-width="1.4" marker-end="url(#arw)" />
  <path d="M545 328 L958 392" stroke="#46516b" stroke-width="1.4" marker-end="url(#arw)" />

  <!-- MCP layer -->
  <rect x="110" y="524" width="974" height="96" rx="14" fill="#12121b" stroke="#a78bfa" stroke-opacity="0.35" />
  <text x="132" y="552" fill="#a78bfa" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">5 MCP SERVERS</text>
  <text x="270" y="552" fill="#61708a" font-family="JetBrains Mono, monospace" font-size="11">fixed parameterized queries only — no free-form SQL reachable by the model</text>

  <rect x="132" y="566" width="196" height="36" rx="9" fill="#151522" stroke="#1e2a40" />
  <text x="230" y="589" fill="#c9d6ea" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">inventory · PostgreSQL</text>

  <rect x="342" y="566" width="196" height="36" rx="9" fill="#151522" stroke="#1e2a40" />
  <text x="440" y="589" fill="#c9d6ea" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">users · SQL Server</text>

  <rect x="552" y="566" width="150" height="36" rx="9" fill="#151522" stroke="#1e2a40" />
  <text x="627" y="589" fill="#c9d6ea" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">vehicles</text>

  <rect x="716" y="566" width="150" height="36" rx="9" fill="#151522" stroke="#1e2a40" />
  <text x="791" y="589" fill="#c9d6ea" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">sales</text>

  <rect x="880" y="566" width="182" height="36" rx="9" fill="#151522" stroke="#1e2a40" />
  <text x="971" y="589" fill="#c9d6ea" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">active directory</text>

  <text x="132" y="654" fill="#46516b" font-family="JetBrains Mono, monospace" font-size="11.5">Node.js · PostgreSQL · SQL Server · Ollama · LDAP · append-only audit log</text>
</svg>
